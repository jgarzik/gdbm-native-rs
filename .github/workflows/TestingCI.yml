name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-aarch64
            os: macos-latest
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libgdbm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgdbm-dev
      - name: Install libgdbm (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gdbm
          echo "GDBM_PREFIX=$(brew --prefix gdbm)" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Test
        run: cargo test --all-features
      - name: C GDBM interoperability
        run: tests/interop/run.sh
        env:
          REQUIRE_GDBM: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Fuzz targets format
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # MSRV (rust-version in Cargo.toml); given as an input so dependabot
      # does not mistake it for an action version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-features

  # 32-bit and big-endian hosts, under QEMU
  cross:
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - s390x-unknown-linux-gnu
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Test
        run: cross test --all-features --target ${{ matrix.target }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Seed corpora with C GDBM fixtures
        run: fuzz/seed-corpus.sh
      - name: Fuzz
        run: |
          for target in open import_ascii import_bin; do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" "fuzz/corpus/$target" -- -max_len=262144 -max_total_time=60 -rss_limit_mb=1024
          done
