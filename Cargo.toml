[package]
name = "gdbm-native"
version = "0.5.2"
authors = ["Jeff Garzik"]
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
description = "Rust-native implementation of GDBM key/value database"
repository = "https://github.com/jgarzik/gdbm-native-rs.git"
# ship only the library; tests, fixtures, examples and tooling stay in the repository
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[features]
diagnostic = []

[dependencies]
base64 = "0.23"
tempfile = "3.27"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
